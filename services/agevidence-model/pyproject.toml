[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athian-agevidence-model"
version = "0.1.0"
description = "Fixture-first AgEvidence model service scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "pydantic>=2.7",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "httpx>=0.27"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
athian_agevidence = ["fixtures/*.json", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
