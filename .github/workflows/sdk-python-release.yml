name: SDK Python Release

on:
  push:
    tags:
      - "sdk-python-v1.0.0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdks/python[test]"
          python -m pip install build twine

      - name: Run SDK tests
        run: python -m pytest sdks/python

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run AgEvidence repository checks
        run: bash scripts/agevidence_check_all.sh

      - name: Release readiness
        run: python scripts/check_sdk_release_readiness.py

      - name: Build wheel and sdist
        working-directory: sdks/python
        run: |
          rm -rf dist build src/agevidence.egg-info
          python -m build

      - name: Twine check
        working-directory: sdks/python
        run: python -m twine check dist/*

      - name: Fresh venv wheel smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          . "$tmpdir/venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install sdks/python/dist/*.whl
          python - <<'PY'
          import agevidence
          print(agevidence.__version__)
          PY
          agevidence --help
          agevidence demo
          agevidence doctor
          agevidence fixture write livestock-weight --out "$tmpdir/fixture.json"
          agevidence ingest "$tmpdir/fixture.json" --format table
          agevidence explain "$tmpdir/fixture.json" --format table
          python - <<'PY'
          from importlib import resources
          import agevidence

          assert agevidence.__version__ == "1.0.0"
          assert resources.files("agevidence").joinpath("py.typed").is_file()
          assert resources.files("agevidence.fixtures").joinpath("data/livestock-weight.json").is_file()
          assert resources.files("agevidence.schemas").joinpath("athian.agevidence.observation.v1.json").is_file()
          PY
          cat > "$tmpdir/my_adapter.py" <<'PY'
          from agevidence.adapters import Adapter
          from agevidence.primitives import Observation

          class MyAdapter(Adapter):
              def map(self, record):
                  return Observation(
                      subject=f"animal:{record['eid']}",
                      observable="methane",
                      value=record["ppm"],
                      unit="ppm",
                      observed_at=record["timestamp"],
                  )
          PY
          mkdir -p "$tmpdir/adapter-fixtures"
          cat > "$tmpdir/adapter-fixtures/one.json" <<'JSON'
          {"eid":"A-1","ppm":18.7,"timestamp":"2026-08-12T15:10:00Z"}
          JSON
          agevidence adapter test "$tmpdir/my_adapter.py" "$tmpdir/adapter-fixtures"

      - name: Fresh venv sdist smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          . "$tmpdir/venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install sdks/python/dist/*.tar.gz
          python - <<'PY'
          from importlib import resources
          import agevidence

          assert agevidence.__version__ == "1.0.0"
          assert resources.files("agevidence").joinpath("py.typed").is_file()
          assert resources.files("agevidence.fixtures").joinpath("data/livestock-weight.json").is_file()
          assert resources.files("agevidence.schemas").joinpath("athian.agevidence.observation.v1.json").is_file()
          print(agevidence.__version__)
          PY
          agevidence --help
          agevidence demo

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: agevidence-python-dist
          path: sdks/python/dist/*
          if-no-files-found: error

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: sdks/python/dist/*
          generate_release_notes: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: agevidence-python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
