[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agevidence"
version = "0.1.0"
description = "Canonical Python SDK and CLI for the Athian AgEvidence Developer OS"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Athian" }
]
maintainers = [
  { name = "Athian" }
]
keywords = ["agevidence", "athian", "sdk", "cli", "evidence", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "jsonschema>=4.22"
]

[project.optional-dependencies]
research = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "jupyter>=1.1",
  "statsmodels>=0.14",
  "scipy>=1.12"
]
test = [
  "build>=1.2",
  "pytest>=8.2"
]

[project.scripts]
agevidence = "agevidence.cli:app"

[project.urls]
Homepage = "https://github.com/meronrudy/athian-evidence-bazaar"
Repository = "https://github.com/meronrudy/athian-evidence-bazaar"
Issues = "https://github.com/meronrudy/athian-evidence-bazaar/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agevidence = ["py.typed", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
