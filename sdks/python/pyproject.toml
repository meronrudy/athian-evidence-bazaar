[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agevidence"
version = "1.0.0"
description = "Portable evidence primitives and verification tooling for agricultural software"
readme = {file = "docs/pypi.md", content-type = "text/markdown"}
requires-python = ">=3.11"
keywords = [
  "agtech",
  "agriculture",
  "evidence",
  "provenance",
  "verification",
  "mrv",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "jsonschema>=4.22"
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8.2"
]

[project.urls]
Homepage = "https://agevidence.com"
Repository = "https://github.com/meronrudy/athian-evidence-bazaar"
Documentation = "https://github.com/meronrudy/athian-evidence-bazaar/tree/main/sdks/python"
Issues = "https://github.com/meronrudy/athian-evidence-bazaar/issues"
Changelog = "https://github.com/meronrudy/athian-evidence-bazaar/releases"

[project.scripts]
agevidence = "agevidence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agevidence*"]

[tool.setuptools.package-data]
agevidence = [
  "py.typed",
  "resources/*.json",
  "fixtures/data/*.json",
  "schemas/*.json",
  "proofkits/*.json",
  "proofkits/fixtures/*.json",
  "proofkits/expected/*.json",
  "proofkits/readmes/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
